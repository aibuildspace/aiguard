[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiguard"
version = "0.1.0"
description = "Anti-virus for AI — a security middleware proxy for LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "security", "proxy", "llm", "prompt-injection", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.20.0",
    "watchfiles>=1.0.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
aiguard = "aiguard.cli.main:app"
guard = "aiguard.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["aiguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
